name: Validate URLs

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:

  validate_urls:
    name: Validate URLs
    runs-on: ubuntu-latest
    environment: 'production'
    permissions:
      contents: read
      issues: write  # Create a new issue with broken URLs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.9
          architecture: x64

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install lychee
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --version

      - name: Extract URLs from YAML files
        run: |
          uv run python utility_scripts/plugin_definitions/extract_urls.py > urls.txt
          echo "Extracted $(wc -l < urls.txt) unique URLs to check"

      - name: Check URLs with lychee
        id: lychee
        continue-on-error: true
        run: |
          lychee --config .github/workflows/resources/lychee.toml \
                 --format json \
                 --output lychee-output.json \
                 urls.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Format lychee output
        id: urls
        if: always()
        run: |
          if [ -f lychee-output.json ]; then
            output=$(cat lychee-output.json | uv run python utility_scripts/plugin_definitions/format_lychee_output.py)
            echo "INVALID_URL<<EOF" >> $GITHUB_ENV
            echo "$output" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "INVALID_URL=" >> $GITHUB_ENV
          fi
      - name: Generate MeltyBot token
        id: app-token
        if: env.INVALID_URL != ''
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.MELTYBOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.MELTYBOT_APP_PRIVATE_KEY }}
          permission-issues: write  # to create/update the invalid-urls issue

      - uses: JasonEtco/create-an-issue@1b14a70e4d8dc185e5cc76d3bec9eab20257b2c5 # v2.9.2
        if: env.INVALID_URL != ''
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          INVALID_URLS: ${{ env.INVALID_URL }}
        with:
          filename: .github/ISSUE_TEMPLATE/invalid_urls.md
          update_existing: true
