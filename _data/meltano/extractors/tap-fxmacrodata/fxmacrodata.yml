capabilities:
- about
- activate-version
- batch
- catalog
- discover
- schema-flattening
- state
- stream-maps
- structured-logging
description: Official macroeconomic, FX and release-calendar data for 18 
  currencies, aggregated from central banks and national statistics agencies
domain_url: https://fxmacrodata.com
keywords:
- api
- meltano_sdk
- macroeconomics
- forex
- economic-data
label: FXMacroData
maintenance_status: active
name: tap-fxmacrodata
namespace: tap_fxmacrodata
next_steps: 'USD macro data is public, so the tap runs without an API key. Indicator
  slugs differ per currency: sync the `data_catalogue` stream first to see what a
  currency publishes, then list the slugs you want in `indicators`.'
pip_url: git+https://github.com/fxmacrodata/tap-fxmacrodata.git
quality: silver
repo: https://github.com/fxmacrodata/tap-fxmacrodata
settings:
- description: FXMacroData API key. USD macro data is public, so the tap runs 
    without one; a key widens it to the other seventeen currencies, the full 
    history, and FX.
  kind: password
  label: API Key
  name: api_key
  sensitive: true
- description: Override the API base URL. Rarely needed.
  kind: string
  label: API URL
  name: api_url
  value: https://api.fxmacrodata.com/v1
- description: Compression format to use for batch files.
  kind: options
  label: Batch Compression Format
  name: batch_config.encoding.compression
  options:
  - label: GZIP
    value: gzip
  - label: None
    value: none
- description: Format to use for batch files.
  kind: options
  label: Batch Encoding Format
  name: batch_config.encoding.format
  options:
  - label: JSONL
    value: jsonl
  - label: Parquet
    value: parquet
- description: Prefix to use when writing batch files.
  kind: string
  label: Batch Storage Prefix
  name: batch_config.storage.prefix
- description: Root path to use when writing batch files.
  kind: string
  label: Batch Storage Root
  name: batch_config.storage.root
- description: Currency codes to extract, for example ["USD", "EUR"].
  kind: array
  label: Currencies
  name: currencies
  value:
  - USD
- description: 'One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization'
  kind: array
  label: Faker Locale
  name: faker_config.locale
- description: 'Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator'
  kind: string
  label: Faker Seed
  name: faker_config.seed
- description: "'True' to enable schema flattening and automatically expand nested
    properties."
  kind: boolean
  label: Enable Schema Flattening
  name: flattening_enabled
- description: The max depth to flatten schemas.
  kind: integer
  label: Max Flattening Depth
  name: flattening_max_depth
- description: The maximum length of a flattened key.
  kind: integer
  label: Max Key Length
  name: flattening_max_key_length
- description: The separator to use when flattening keys.
  kind: string
  label: Flattening Separator
  name: flattening_separator
- description: Currency pairs for the forex_rates stream, for example 
    ["EUR/USD"]. Leave unset to skip FX.
  kind: array
  label: Fx Pairs
  name: fx_pairs
- description: Indicator slugs for the announcements stream, for example 
    ["inflation", "policy_rate"]. Sync the data_catalogue stream first to see 
    what a currency publishes. Leave unset to skip announcements.
  kind: array
  label: Indicators
  name: indicators
- description: Earliest reference date to extract for dated streams.
  kind: date_iso8601
  label: Start Date
  name: start_date
- description: User-defined config values to be used within map expressions.
  kind: object
  label: User Stream Map Configuration
  name: stream_map_config
- description: Config object for stream maps capability. For more information 
    check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html).
  kind: object
  label: Stream Maps
  name: stream_maps
settings_group_validation:
- []
supported_python_versions:
- '3.9'
- '3.10'
- '3.11'
- '3.12'
- '3.13'
- '3.14'
variant: fxmacrodata
