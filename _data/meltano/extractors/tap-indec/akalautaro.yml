capabilities:
- about
- activate-version
- batch
- catalog
- discover
- schema-flattening
- state
- stream-maps
- structured-logging
description: >-
  Series estadísticas del INDEC desde la API de datos.gob.ar: IPC, EMAE y
  tasas de la EPH.
domain_url: https://www.indec.gob.ar/
executable: tap-indec
keywords:
- meltano_sdk
- indec
- argentina
- estadisticas
- datos-abiertos
- ipc
- emae
- eph
label: INDEC
logo_url: /assets/logos/extractors/indec.svg
maintenance_status: active
name: tap-indec
namespace: tap_indec
next_steps: ''
pip_url: tap-indec
quality: unknown
repo: https://github.com/akalautaro/tap-indec
settings:
- description: URL base de la API de series de datos. Gob. Ar.
  kind: string
  label: API URL
  name: api_url
  value: https://apis.datos.gob.ar/series/api
- description: Compression format to use for batch files.
  kind: options
  label: Batch Compression Format
  name: batch_config.encoding.compression
  options:
  - label: GZIP
    value: gzip
  - label: None
    value: none
- description: Format to use for batch files.
  kind: options
  label: Batch Encoding Format
  name: batch_config.encoding.format
  options:
  - label: JSONL
    value: jsonl
  - label: Parquet
    value: parquet
- description: Prefix to use when writing batch files.
  kind: string
  label: Batch Storage Prefix
  name: batch_config.storage.prefix
- description: Root path to use when writing batch files.
  kind: string
  label: Batch Storage Root
  name: batch_config.storage.root
- description: Fecha final inclusive, en formato ISO 8601 (YYYY-MM-DD).
  kind: date_iso8601
  label: End Date
  name: end_date
- description: Si es true, un error de la API corta el sync. Si es false, se 
    registra el error y se continúa con la próxima serie.
  kind: boolean
  label: Fail On Series Error
  name: fail_on_series_error
  value: true
- description: 'One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization'
  kind: array
  label: Faker Locale
  name: faker_config.locale
- description: 'Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator'
  kind: string
  label: Faker Seed
  name: faker_config.seed
- description: "'True' to enable schema flattening and automatically expand nested
    properties."
  kind: boolean
  label: Enable Schema Flattening
  name: flattening_enabled
- description: The max depth to flatten schemas.
  kind: integer
  label: Max Flattening Depth
  name: flattening_max_depth
- description: The maximum length of a flattened key.
  kind: integer
  label: Max Key Length
  name: flattening_max_key_length
- description: The separator to use when flattening keys.
  kind: string
  label: Flattening Separator
  name: flattening_separator
- description: Si es true, ignora el estado incremental y recarga cada serie 
    desde start_date o desde su primera fecha disponible. El estado se vuelve a 
    escribir al terminar.
  kind: boolean
  label: Full Refresh
  name: full_refresh
  value: false
- description: Si es true, incluye series marcadas como discontinuadas en el 
    catálogo. Por defecto se omiten.
  kind: boolean
  label: Include Discontinued
  name: include_discontinued
  value: false
- description: Reintentos ante errores transitorios (429 y 5xx).
  kind: integer
  label: Max Retries
  name: max_retries
  value: 5
- description: Puntos por página al paginar una serie (máximo 1000).
  kind: integer
  label: Page Size
  name: page_size
  value: 1000
- description: 'Filtro opcional por stream. Ejemplo: {"ipc": ["148.3_INIVELNAL_DICI_M_26"]}.
    Si un stream no aparece, se sincronizan todas sus series.'
  kind: object
  label: Series
  name: series
- description: Fecha inicial de la carga, en formato ISO 8601 (YYYY-MM-DD). Si 
    se omite, cada serie arranca en su primera fecha disponible.
  kind: date_iso8601
  label: Start Date
  name: start_date
- description: User-defined config values to be used within map expressions.
  kind: object
  label: User Stream Map Configuration
  name: stream_map_config
- description: Currently, only setting this to `__NULL__` is supported. This 
    will remove all other streams.
  kind: string
  label: Other streams
  name: stream_maps.__else__
- description: Timeout por request, en segundos.
  kind: integer
  label: Timeout
  name: timeout
  value: 30
- description: Header User-Agent enviado a la API.
  kind: string
  label: User Agent
  name: user_agent
settings_group_validation: []
settings_preamble: ''
usage: ''
variant: akalautaro
