capabilities:
- about
- activate-version
- batch
- catalog
- discover
- schema-flattening
- state
- stream-maps
- structured-logging
description: Rental management software for car, van and two-wheeler rental companies
domain_url: https://lexio.rent/logiciel-location-voiture
executable: tap-lexio
keywords:
- meltano_sdk
label: Lexio Rent
logo_url: /assets/logos/extractors/lexio.png
maintenance_status: active
name: tap-lexio
namespace: tap_lexio
next_steps: ''
pip_url: tap-lexio
quality: unknown
repo: https://github.com/lexio-rent-git/tap-lexio
settings:
- description: Lexio API key (lck_...), from Settings > Developer > API tokens in
    Lexio. API access is part of the Business plan.
  kind: password
  label: API key
  name: api_key
  sensitive: true
- description: Base URL of the Lexio Rent API v1.
  kind: string
  label: API URL
  name: api_url
  value: https://api.lexio.rent/api/external/v1
- description: Compression format to use for batch files.
  kind: options
  label: Batch Compression Format
  name: batch_config.encoding.compression
  options:
  - label: GZIP
    value: gzip
  - label: None
    value: none
- description: Format to use for batch files.
  kind: options
  label: Batch Encoding Format
  name: batch_config.encoding.format
  options:
  - label: JSONL
    value: jsonl
  - label: Parquet
    value: parquet
- description: Prefix to use when writing batch files.
  kind: string
  label: Batch Storage Prefix
  name: batch_config.storage.prefix
- description: Root path to use when writing batch files.
  kind: string
  label: Batch Storage Root
  name: batch_config.storage.root
- description: 'vehicle_blocks stream: last day of the window, in days after today.'
  kind: integer
  label: 'Vehicle blocks: days ahead'
  name: blocks_days_ahead
  value: 180
- description: 'vehicle_blocks stream: first day of the window, in days before today.'
  kind: integer
  label: 'Vehicle blocks: days back'
  name: blocks_days_back
  value: 30
- description: 'One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization'
  kind: array
  label: Faker Locale
  name: faker_config.locale
- description: 'Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator'
  kind: string
  label: Faker Seed
  name: faker_config.seed
- description: '''True'' to enable schema flattening and automatically expand nested
    properties.'
  kind: boolean
  label: Enable Schema Flattening
  name: flattening_enabled
- description: The max depth to flatten schemas.
  kind: integer
  label: Max Flattening Depth
  name: flattening_max_depth
- description: The maximum length of a flattened key.
  kind: integer
  label: Max Key Length
  name: flattening_max_key_length
- description: The separator to use when flattening keys.
  kind: string
  label: Flattening Separator
  name: flattening_separator
- description: User-defined config values to be used within map expressions.
  kind: object
  label: User Stream Map Configuration
  name: stream_map_config
- description: Config object for stream maps capability. For more information check
    out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html).
  kind: object
  label: Stream Maps
  name: stream_maps
settings_group_validation:
- - api_key
settings_preamble: ''
supported_python_versions:
- '3.10'
- '3.11'
- '3.12'
- '3.13'
usage: ''
variant: lexio-rent
