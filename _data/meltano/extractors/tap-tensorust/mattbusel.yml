capabilities:
- about
- activate-version
- batch
- catalog
- discover
- schema-flattening
- state
- stream-maps
- structured-logging
description: Private credit loan marks, BDC lender disagreements, Q3 2026 
  markdowns, banned-vendor federal award exposure and the Tensorust dataset 
  catalog
domain_url: https://tensorust.com
executable: tap-tensorust
keywords:
- api
- meltano_sdk
- finance
- private-credit
- compliance
label: Tensorust
logo_url: /assets/logos/extractors/tensorust.png
maintenance_status: active
name: tap-tensorust
namespace: tap_tensorust
next_steps: 'The tap runs without an API key: every stream then returns the free preview
  (for example the top 10 rows of `credit_disagreements` and `q3_cuts`). A Tensorust
  enterprise key in `api_key` returns the full rows. Set `companies` to choose the
  borrowers for `lender_marks`, and `dataset_slugs` to choose which dataset samples
  to pull (sync `datasets_catalog` first to see the slugs).'
pip_url: git+https://github.com/Mattbusel/tap-tensorust.git
quality: silver
repo: https://github.com/Mattbusel/tap-tensorust
settings:
- description: 'Tensorust enterprise key (it starts with tdk_), sent as a bearer token.
    Optional: without it every stream returns the free preview (for example the top
    10 rows); with it, the full rows. Keys: https://shop.tensorust.com/offers/enterprise-api'
  kind: password
  label: API Key
  name: api_key
  sensitive: true
- description: Override the API base URL. Rarely needed.
  kind: string
  label: API URL
  name: api_url
  value: https://shop.tensorust.com/api
- description: Compression format to use for batch files.
  kind: options
  label: Batch Compression Format
  name: batch_config.encoding.compression
  options:
  - label: GZIP
    value: gzip
  - label: None
    value: none
- description: Format to use for batch files.
  kind: options
  label: Batch Encoding Format
  name: batch_config.encoding.format
  options:
  - label: JSONL
    value: jsonl
  - label: Parquet
    value: parquet
- description: Prefix to use when writing batch files.
  kind: string
  label: Batch Storage Prefix
  name: batch_config.storage.prefix
- description: Root path to use when writing batch files.
  kind: string
  label: Batch Storage Root
  name: batch_config.storage.root
- description: Borrower names for the lender_marks stream, as BDC schedules 
    spell them (a prefix works, e.g. ["Pluralsight", "Assembly Intermediate"]). 
    Leave unset to use the companies in the credit_disagreements list.
  kind: array
  label: Companies
  name: companies
- description: Dataset slugs whose 25-row samples the dataset_sample stream 
    pulls. Sync datasets_catalog first to see them. Leave unset to pull every 
    published sample.
  kind: array
  label: Dataset Slugs
  name: dataset_slugs
- description: 'Banned-vendor lists for the exposure_awards search: BIOSECURE, 1260H,
    UFLPA, SEC889, FCC_COVERED. Leave unset for all five.'
  kind: array
  label: Exposure Lists
  name: exposure_lists
- description: 'One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization'
  kind: array
  label: Faker Locale
  name: faker_config.locale
- description: 'Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator'
  kind: string
  label: Faker Seed
  name: faker_config.seed
- description: '''True'' to enable schema flattening and automatically expand nested
    properties.'
  kind: boolean
  label: Enable Schema Flattening
  name: flattening_enabled
- description: The max depth to flatten schemas.
  kind: integer
  label: Max Flattening Depth
  name: flattening_max_depth
- description: The maximum length of a flattened key.
  kind: integer
  label: Max Key Length
  name: flattening_max_key_length
- description: The separator to use when flattening keys.
  kind: string
  label: Flattening Separator
  name: flattening_separator
- description: 'Federal award recipients (name or UEI) for exposure_awards, e.g. ["Stanford
    University"]. When set, the stream pulls each institution''s awards instead of
    the per-list search: the 5 largest without a key, every award with its evidence
    sentence with one.'
  kind: array
  label: Institutions
  name: institutions
- description: User-defined config values to be used within map expressions.
  kind: object
  label: User Stream Map Configuration
  name: stream_map_config
- description: Config object for stream maps capability. For more information 
    check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html).
  kind: object
  label: Stream Maps
  name: stream_maps
settings_group_validation:
- []
settings_preamble: ''
supported_python_versions:
- '3.10'
- '3.11'
- '3.12'
- '3.13'
- '3.14'
usage: ''
variant: mattbusel
