description: "A generic Singer tap for the \"diffgen\" pattern: an application-level
  audit-log table that journals every INSERT/UPDATE/DELETE made to other tables in
  the same database. Instead of reading a target table directly, the tap replays that
  log since the last bookmark and, per event, either repulls the affected row fresh
  (insert/update) or emits a tombstone -- just the primary key plus is_deleted: true
  (delete). This is what a plain timestamp-filtered incremental extraction can never
  represent on its own: a deleted row doesn't show up in a WHERE updated_at > ...
  query, so deletes silently vanish downstream. Supports PostgreSQL and MySQL, with
  a per-table tombstones_only mode for tables that already have a separate, conventional
  incremental tap and just need the DELETE gap filled."
domain_url: https://en.wikipedia.org/wiki/Change_data_capture
