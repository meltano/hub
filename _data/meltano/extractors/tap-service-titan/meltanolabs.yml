capabilities:
- about
- activate-version
- batch
- catalog
- discover
- schema-flattening
- state
- stream-maps
- structured-logging
description: Service Titan is a software platform for commercial and residential
  trades
domain_url: https://www.servicetitan.com/
executable: tap-service-titan
keywords:
- meltano_sdk
label: Service Titan
logo_url: /assets/logos/extractors/servicetitan.svg
maintenance_status: active
name: tap-service-titan
namespace: tap_service_titan
next_steps: ''
pip_url: git+https://github.com/MeltanoLabs/tap-service-titan.git
quality: gold
repo: https://github.com/MeltanoLabs/tap-service-titan
settings:
- description: The URL for the ServiceTitan API
  kind: options
  label: API URL
  name: api_url
  options:
  - label: Production
    value: https://api.servicetitan.io
  - label: Integration
    value: https://api-integration.servicetitan.io
  value: https://api.servicetitan.io
- description: The URL for the ServiceTitan OAuth API
  kind: options
  label: Auth URL
  name: auth_url
  options:
  - label: Production
    value: https://auth.servicetitan.io/connect/token
  - label: Integration
    value: https://auth-integration.servicetitan.io/connect/token
  value: https://auth.servicetitan.io/connect/token
- description: Compression format to use for batch files.
  kind: options
  label: Batch Compression Format
  name: batch_config.encoding.compression
  options:
  - label: GZIP
    value: gzip
  - label: None
    value: none
- description: Format to use for batch files.
  kind: options
  label: Batch Encoding Format
  name: batch_config.encoding.format
  options:
  - label: JSONL
    value: jsonl
  - label: Parquet
    value: parquet
- description: Prefix to use when writing batch files.
  kind: string
  label: Batch Storage Prefix
  name: batch_config.storage.prefix
- description: Root path to use when writing batch files.
  kind: string
  label: Batch Storage Root
  name: batch_config.storage.root
- description: Business unit IDs to request availability for in the `capacities`
    stream. When omitted, the tap auto-discovers all active business unit IDs 
    via the `/settings/v2/.../export/business-units` endpoint. Explicit IDs 
    (auto-discovered or configured) are always sent to the capacity endpoint; an
    unfiltered query can silently omit business units that aren't part of a 
    capacity group.
  kind: array
  label: Capacities Business Unit IDs
  name: capacities_business_unit_ids
- description: Number of days ahead of the current date to pull availability for
    the `capacities` stream. The stream issues one request per day in the window
    `[today, today + capacities_lookahead_days]`, so larger values increase the 
    number of API calls (and runtime) per sync.
  kind: integer
  label: Capacities Lookahead Days
  name: capacities_lookahead_days
  value: 14
- description: The client ID to use in authenticating.
  kind: password
  label: Client ID
  name: client_id
  sensitive: true
- description: The client secret to use in authenticating.
  kind: password
  label: Client Secret
  name: client_secret
  sensitive: true
- description: Custom reports to extract.
  kind: array
  label: Custom Reports
  name: custom_reports
- description: 'One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization'
  kind: array
  label: Faker Locale
  name: faker_config.locale
- description: 'Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator'
  kind: string
  label: Faker Seed
  name: faker_config.seed
- description: "'True' to enable schema flattening and automatically expand nested
    properties."
  kind: boolean
  label: Enable Schema Flattening
  name: flattening_enabled
- description: The max depth to flatten schemas.
  kind: integer
  label: Max Flattening Depth
  name: flattening_max_depth
- description: The maximum length of a flattened key.
  kind: integer
  label: Max Key Length
  name: flattening_max_key_length
- description: The separator to use when flattening keys.
  kind: string
  label: Flattening Separator
  name: flattening_separator
- description: The app key for the Service Titan app used to authenticate.
  kind: password
  label: St App Key
  name: st_app_key
  sensitive: true
- description: The start date-time for incremental streams.
  kind: date_iso8601
  label: Start Date
  name: start_date
- description: User-defined config values to be used within map expressions.
  kind: object
  label: User Stream Map Configuration
  name: stream_map_config
- description: Config object for stream maps capability. For more information 
    check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html).
  kind: object
  label: Stream Maps
  name: stream_maps
- description: Tenant ID to pull records for.
  kind: password
  label: Tenant ID
  name: tenant_id
  sensitive: true
settings_group_validation:
- - client_id
  - client_secret
  - st_app_key
  - tenant_id
settings_preamble: ''
supported_python_versions:
- '3.10'
- '3.11'
- '3.12'
- '3.13'
- '3.14'
usage: ''
variant: meltanolabs
