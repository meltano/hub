capabilities:
- about
- schema-flattening
- stream-maps
- structured-logging
- validate-records
description: Inbound Marketing software
domain_url: https://developers.hubspot.com/docs/api/overview
executable: target-hubspot
keywords:
- meltano_sdk
label: HubSpot
logo_url: /assets/logos/loaders/hubspot.png
maintenance_status: beta
name: target-hubspot
namespace: target_hubspot
next_steps: ''
pip_url: git+https://github.com/MeltanoLabs/target-hubspot.git
quality: silver
repo: https://github.com/MeltanoLabs/target-hubspot
settings:
- description: Your HubSpot private app API access token. See the 
    [docs](https://developers.hubspot.com/docs/api/private-apps) for more 
    details.
  kind: password
  label: Access Token
  name: access_token
  sensitive: true
- description: Whether to add metadata fields to records.
  kind: boolean
  label: Add Record Metadata
  name: add_record_metadata
- description: Maximum number of rows in each batch.
  kind: integer
  label: Batch Size Rows
  name: batch_size_rows
- description: An array including an object entry for each column in your import
    file stream. Columns are matched to stream properties by `columnName`; 
    stream properties without an entry are not imported.
  kind: array
  label: Column Mapping
  name: column_mapping
- description: The format the target writes date values in. Date and time values
    are written as UNIX timestamps in milliseconds.
  kind: options
  label: Date Format
  name: date_format
  options:
  - label: Month Day Year
    value: MONTH_DAY_YEAR
  - label: Year Month Day
    value: YEAR_MONTH_DAY
  - label: Day Month Year
    value: DAY_MONTH_YEAR
  value: YEAR_MONTH_DAY
- description: 'One or more LCID locale strings to produce localized output for: https://faker.readthedocs.io/en/master/#localization'
  kind: array
  label: Faker Locale
  name: faker_config.locale
- description: 'Value to seed the Faker generator for deterministic output: https://faker.readthedocs.io/en/master/#seeding-the-generator'
  kind: string
  label: Faker Seed
  name: faker_config.seed
- description: "'True' to enable schema flattening and automatically expand nested
    properties."
  kind: boolean
  label: Enable Schema Flattening
  name: flattening_enabled
- description: The max depth to flatten schemas.
  kind: integer
  label: Max Flattening Depth
  name: flattening_max_depth
- description: The maximum length of a flattened key.
  kind: integer
  label: Max Key Length
  name: flattening_max_key_length
- description: The separator to use when flattening keys.
  kind: string
  label: Flattening Separator
  name: flattening_separator
- description: Used to indicate whether the import should create and update, 
    only create, or only update records. Applies to every object type in the 
    column mapping.
  kind: options
  label: Import Operations
  name: import_operations
  options:
  - label: Create
    value: CREATE
  - label: Update
    value: UPDATE
  - label: Upsert
    value: UPSERT
  value: UPDATE
- description: How long to wait for HubSpot to finish each import before failing
    the run.
  kind: integer
  label: Import Timeout Seconds
  name: import_timeout_seconds
  value: 3600
- description: The method to use when loading data into the destination. 
    `append-only` will always write all input records whether that records 
    already exists or not. `upsert` will update existing records and insert new 
    records. `overwrite` will delete all existing records and insert all input 
    records.
  kind: options
  label: Load Method
  name: load_method
  options:
  - label: Append Only
    value: append-only
  - label: Upsert
    value: upsert
  - label: Overwrite
    value: overwrite
  value: append-only
- description: User-defined config values to be used within map expressions.
  kind: object
  label: User Stream Map Configuration
  name: stream_map_config
- description: Config object for stream maps capability. For more information 
    check out [Stream Maps](https://sdk.meltano.com/en/latest/stream_maps.html).
  kind: object
  label: Stream Maps
  name: stream_maps
- description: Whether to validate the schema of the incoming streams.
  kind: boolean
  label: Validate Records
  name: validate_records
  value: true
settings_group_validation:
- - access_token
  - column_mapping
settings_preamble: ''
supported_python_versions:
- '3.10'
- '3.11'
- '3.12'
- '3.13'
- '3.14'
- '3.15'
usage: ''
variant: meltanolabs
